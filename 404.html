<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · CodeQuest Academy</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font: 400 1.05rem/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #edf0f5; color: #0e1a33; }
    @media (prefers-color-scheme: dark) { body { background: #0a1226; color: #e7edf9; } a.btn { background: #e7edf9 !important; color: #0a1226 !important; } }
    main { max-width: 30rem; }
    .bar { display: block; width: 6.5rem; height: 6px; border-radius: 3px; margin-bottom: 1.2rem; background: linear-gradient(90deg, #0f9d6b 0 20%, #e0344f 20% 40%, #2f6beb 40% 60%, #8b47d1 60% 80%, #f2b01e 80% 100%); }
    h1 { font-size: 2.4rem; line-height: 1.1; margin: 0 0 0.6rem; }
    a.btn { display: inline-block; margin-top: 0.6rem; padding: 0.7rem 1.2rem; border-radius: 8px; background: #0e1a33; color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="bar"></span>
    <h1>This stop is not on the map</h1>
    <p>The page you tried to open does not exist. The lessons all live behind the home page, so head back there and pick up your route.</p>
    <a class="btn" id="home" href="/">Back to CodeQuest Academy</a>
  </main>
  <script>
    // The deploy workflow replaces the placeholder below with the site's base path (for example /my-repo/).
    var base = '__BASE__';
    if (base.indexOf('__') === 0) base = '/';
    document.getElementById('home').setAttribute('href', base);
  </script>
</body>
</html>
